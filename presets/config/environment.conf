# Environment for build plugins and scripts, on both host and container.
# 宿主与容器内构建插件和脚本使用的环境变量。
[Environment]
# Assign a literal value, or inherit a variable from the RStarSleep process.
# 直接赋值，或从 RStarSleep 进程环境继承；来源未设置时移除目标变量。
# http_proxy=http://127.0.0.1:10808
# https_proxy=%https_proxy
# all_proxy=%all_proxy
# no_proxy=%no_proxy
# HTTP_PROXY=%HTTP_PROXY
# HTTPS_PROXY=%HTTPS_PROXY
# ALL_PROXY=%ALL_PROXY
# NO_PROXY=%NO_PROXY
# A leading %% assigns a literal %; values are not evaluated by a shell.
# 开头 %% 表示字面量 %；值不会经过 shell 求值。
