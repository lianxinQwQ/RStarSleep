# Arch Linux build and maintenance plugin.
# Arch Linux 构建与维护插件。
schema_version = 1
api_version = 3
id = "arch"
version = "0.17.2"
# Bump only when the independent download environment becomes incompatible.
# 仅在独立下载环境不兼容时递增。
predownload_version = "1"
system_types = ["arch"]
architectures = ["x86_64"]
cache_format = "arch-root-v1"
protected_packages = ["base"]

# Required host tools are checked before bootstrap.
# bootstrap 前检查的宿主必需工具。
predownload = true
predownload_plans = true
package_maintenance = true
post_maintenance = true
mount_inheritance = true
query_package_files = true
query_package_database_paths = true
readonly_queries = ["query_packages", "list_orphans", "query_package_files", "query_package_database_paths"]
# Seed missing data files from default-data without replacing user configuration.
# 使用前从 default-data 补齐 data 中缺失的文件，保留已有配置。
persistent_dirs = [
    "arch-data:data",
    "arch-bootstrap:state/bootstrap",
    "arch-packages:state/packages",
    "arch-repository:state/repository",
    "arch-sources:state/sources",
]

# Account semantics are distribution-owned; all three actions run on the host.
# 账户语义由发行版定义；三个操作均在宿主运行。
# This capability enables calls; accepted settings are declared in config below.
# 此能力开启操作调用；接受的配置项由下方 config 声明。
[account_inheritance]
workdir = "account-inheritance"
paths = ["/etc/passwd", "/etc/group", "/etc/shadow", "/etc/gshadow"]
tools = ["python3"]

# Target installation closure, collected before target build allocation.
# 分配目标构建版本前收集的目标安装闭包。
[package_plan]
base_packages = ["base"]
tools = ["python3", "pacman", "pacman-key", "pacman-conf", "gpg", "timeout", "git", "makepkg", "vercmp", "runuser"]

# Main-system boot requirements and ordered artifacts, relative to the target root.
# 主系统启动依赖及有序启动产物；source 相对于目标系统根。
[boot]
packages = ["linux", "mkinitcpio"]
artifacts = [
    { source = "boot/intel-ucode.img", destination = "intel-ucode.img", kind = "initrd", optional = true },
    { source = "boot/amd-ucode.img", destination = "amd-ucode.img", kind = "initrd", optional = true },
    { source = "boot/initramfs-linux.img", destination = "initramfs-linux.img", kind = "initrd", optional = false },
    { source = "boot/vmlinuz-linux", destination = "vmlinuz", kind = "kernel", optional = false },
]

# Required only for a main system with deferred copy-on-write inheritance.
# 仅主系统启用延后写时复制继承时需要。
[initramfs_inheritance]
packages = ["mkinitcpio", "btrfs-progs", "coreutils", "util-linux", "bash", "findutils"]
tools = ["mkinitcpio", "btrfs", "cp", "mount", "findmnt", "mkdir", "sleep", "bash", "find", "install"]

# Unified effective build parameters accepted by single-system operations.
# 单系统操作接受的统一生效构建参数。
[config]
required = []
optional = [
    "RSTAR_CONFIG_SCHEMAVERSION", "RSTAR_DISTRIBUTION_DISTRIBUTION", "RSTAR_CONTENT_PACKAGES",
    "RSTAR_DISTRIBUTION_ARCHITECTURE", "RSTAR_DISTRIBUTION_BOOTSTRAPURL",
    "RSTAR_DISTRIBUTION_BOOTSTRAPSIGNATUREURL", "RSTAR_DISTRIBUTION_KEYRING",
    "RSTAR_DISTRIBUTION_MIRROR", "RSTAR_DISTRIBUTION_AURKEYSERVER", "RSTAR_CONTENT_FSTABLINES",
    "RSTAR_CONTENT_ROOTPASSWORD",
    "RSTAR_DISTRIBUTION_AURDEVEL", "RSTAR_DISTRIBUTION_AURREBUILD",
    "RSTAR_ACCOUNTINHERITANCE_USERS", "RSTAR_ACCOUNTINHERITANCE_GROUPS",
    "RSTAR_ACCOUNTINHERITANCE_DRIFTPOLICY",
]

[config.constraints.RSTAR_CONFIG_SCHEMAVERSION]
kind = "number"

[config.constraints.RSTAR_DISTRIBUTION_DISTRIBUTION]
kind = "enum-single"
values = ["arch"]

[config.constraints.RSTAR_CONTENT_PACKAGES]
kind = "free-list"

[config.constraints.RSTAR_CONTENT_FSTABLINES]
kind = "free-list"

[config.constraints.RSTAR_CONTENT_ROOTPASSWORD]
kind = "free-single"

[config.constraints.RSTAR_DISTRIBUTION_ARCHITECTURE]
kind = "enum-single"
values = ["x86_64"]

[config.constraints.RSTAR_DISTRIBUTION_BOOTSTRAPURL]
kind = "free-single"

[config.constraints.RSTAR_DISTRIBUTION_BOOTSTRAPSIGNATUREURL]
kind = "free-single"

[config.constraints.RSTAR_DISTRIBUTION_KEYRING]
kind = "free-single"

[config.constraints.RSTAR_DISTRIBUTION_MIRROR]
kind = "free-single"

[config.constraints.RSTAR_DISTRIBUTION_AURKEYSERVER]
kind = "free-single"

[config.constraints.RSTAR_DISTRIBUTION_AURDEVEL]
kind = "enum-single"
values = ["true", "false"]

[config.constraints.RSTAR_DISTRIBUTION_AURREBUILD]
kind = "free-list"

[config.constraints.RSTAR_ACCOUNTINHERITANCE_USERS]
kind = "free-list"

[config.constraints.RSTAR_ACCOUNTINHERITANCE_GROUPS]
kind = "free-list"

[config.constraints.RSTAR_ACCOUNTINHERITANCE_DRIFTPOLICY]
kind = "enum-single"
values = ["silent", "warn", "error", "assess"]

# Base changes invalidate downstream caches; package targets are reconciled during maintenance.
# 基础变化使后续缓存失效；软件目标在维护中协调。
# Select foundation inputs explicitly so AUR query/rebuild policies do not discard stage caches.
# 显式选择基础输入，避免 AUR 查询/重建策略丢弃阶段缓存；新增基础参数需同步登记。
[cache]
base_system = ["RSTAR_CONFIG", "RSTAR_DISTRIBUTION_DISTRIBUTION", "RSTAR_DISTRIBUTION_ARCHITECTURE", "RSTAR_DISTRIBUTION_BOOTSTRAPURL", "RSTAR_DISTRIBUTION_BOOTSTRAPSIGNATUREURL", "RSTAR_DISTRIBUTION_KEYRING", "RSTAR_DISTRIBUTION_MIRROR", "RSTAR_DISTRIBUTION_AURKEYSERVER"]
software = []

[tools]
host = ["bash", "curl", "tar", "zstd", "gpg", "gpgv", "cp", "rm", "mktemp", "cat", "dirname", "mkdir", "sha256sum", "chmod"]
# Required tools are checked inside the target system before system operations.
# 系统内操作前，在目标系统检查的必需工具。
system = ["bash", "pacman", "pacman-key", "pacman-conf", "gpg", "timeout", "chpasswd", "awk", "cat", "rm", "mktemp", "dirname", "cp", "mkdir", "mv", "chmod", "stat", "find", "sha256sum"]

predownload = ["python3", "git", "makepkg", "repo-add", "repo-remove", "bsdtar", "vercmp", "runuser", "gpg"]
