# Arch Linux build and maintenance plugin.
# Arch Linux 构建与维护插件。
schema_version = 1
api_version = 3
id = "arch"
version = "0.9.0"
system_types = ["arch"]
architectures = ["x86_64"]
cache_format = "arch-root-v1"
protected_packages = ["base"]

# Required host tools are checked before bootstrap.
# bootstrap 前检查的宿主必需工具。
predownload = true
mount_inheritance = true
query_package_files = true
persistent_dirs = [
    "arch-bootstrap:state/bootstrap",
    "arch-packages:state/packages",
    "arch-repository:state/repository",
    "arch-sources:state/sources",
]

# Target installation closure, collected before target build allocation.
# 分配目标构建版本前收集的目标安装闭包。
[package_plan]
base_packages = ["base"]
tools = ["python3", "pacman", "git", "makepkg", "vercmp", "runuser"]

# Main-system boot requirements and ordered artifacts, relative to the target root.
# 主系统启动依赖及有序启动产物；source 相对于目标系统根。
[boot]
packages = ["linux", "mkinitcpio"]
artifacts = [
    { source = "boot/intel-ucode.img", destination = "intel-ucode.img", kind = "initrd", optional = true },
    { source = "boot/amd-ucode.img", destination = "amd-ucode.img", kind = "initrd", optional = true },
    { source = "boot/initramfs-linux.img", destination = "initramfs-linux.img", kind = "initrd", optional = false },
    { source = "boot/vmlinuz-linux", destination = "vmlinuz", kind = "kernel", optional = false },
]

# Required only for a main system with deferred copy-on-write inheritance.
# 仅主系统启用延后写时复制继承时需要。
[initramfs_inheritance]
packages = ["mkinitcpio", "btrfs-progs", "coreutils", "util-linux", "bash", "findutils"]
tools = ["mkinitcpio", "btrfs", "cp", "mount", "findmnt", "mkdir", "sleep", "bash", "find", "install"]

# Unified effective build parameters accepted by single-system operations.
# 单系统操作接受的统一生效构建参数。
[config]
required = []
optional = [
    "RSTAR_CONFIG_SCHEMAVERSION", "RSTAR_DISTRIBUTION_DISTRIBUTION", "RSTAR_CONTENT_PACKAGES",
    "RSTAR_DISTRIBUTION_ARCHITECTURE", "RSTAR_DISTRIBUTION_BOOTSTRAPURL",
    "RSTAR_DISTRIBUTION_BOOTSTRAPSIGNATUREURL", "RSTAR_DISTRIBUTION_KEYRING",
    "RSTAR_DISTRIBUTION_MIRROR", "RSTAR_DISTRIBUTION_AURKEYSERVER", "RSTAR_CONTENT_FSTABLINES",
]

[config.constraints.RSTAR_CONFIG_SCHEMAVERSION]
kind = "number"

[config.constraints.RSTAR_DISTRIBUTION_DISTRIBUTION]
kind = "enum-single"
values = ["arch"]

[config.constraints.RSTAR_CONTENT_PACKAGES]
kind = "free-list"

[config.constraints.RSTAR_CONTENT_FSTABLINES]
kind = "free-list"

[config.constraints.RSTAR_DISTRIBUTION_ARCHITECTURE]
kind = "enum-single"
values = ["x86_64"]

[config.constraints.RSTAR_DISTRIBUTION_BOOTSTRAPURL]
kind = "free-single"

[config.constraints.RSTAR_DISTRIBUTION_BOOTSTRAPSIGNATUREURL]
kind = "free-single"

[config.constraints.RSTAR_DISTRIBUTION_KEYRING]
kind = "free-single"

[config.constraints.RSTAR_DISTRIBUTION_MIRROR]
kind = "free-single"

[config.constraints.RSTAR_DISTRIBUTION_AURKEYSERVER]
kind = "free-single"

# Base changes invalidate downstream caches; package targets are reconciled during maintenance.
# 基础变化使后续缓存失效；软件目标在维护中协调。
[cache]
base_system = ["RSTAR_CONFIG", "RSTAR_DISTRIBUTION"]
software = []

[tools]
host = ["bash", "curl", "tar", "zstd", "gpg", "gpgv", "cp", "rm", "mktemp", "cat", "dirname", "mkdir", "sha256sum"]
# Required tools are checked inside the target system before system operations.
# 系统内操作前，在目标系统检查的必需工具。
system = ["bash", "pacman", "pacman-key", "awk", "cat", "rm", "mktemp", "dirname", "cp", "mkdir", "mv", "chmod"]

predownload = ["python3", "git", "makepkg", "repo-add", "repo-remove", "bsdtar", "vercmp", "runuser", "gpg"]
