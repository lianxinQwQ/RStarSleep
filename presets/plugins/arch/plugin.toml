# Arch Linux build and maintenance plugin.
# Arch Linux 构建与维护插件。
schema_version = 1
api_version = 3
id = "arch"
version = "0.5.0"
system_types = ["arch"]
architectures = ["x86_64"]
cache_format = "arch-root-v1"
protected_packages = ["base"]

# Required host tools are checked before bootstrap.
# bootstrap 前检查的宿主必需工具。
predownload = true
persistent_dirs = [
    "arch-bootstrap:state/bootstrap",
    "arch-packages:state/packages",
    "arch-repository:state/repository",
    "arch-sources:state/sources",
]

# Original [Distribution] keys accepted by all plugin operations.
# 所有插件操作接受的原始 [Distribution] 键名。
[config]
required = []
optional = ["Architecture", "BootstrapUrl", "BootstrapSignatureUrl", "Keyring", "Mirror", "AurKeyserver"]

[tools]
host = ["bash", "curl", "tar", "zstd", "gpgv", "cp", "rm", "mktemp", "cat", "dirname", "mkdir", "sha256sum"]
# Required tools are checked inside the target system before system operations.
# 系统内操作前，在目标系统检查的必需工具。
system = ["bash", "pacman", "pacman-key", "awk", "cat", "rm", "mktemp", "dirname", "cp", "mkdir"]

predownload = ["python3", "git", "makepkg", "repo-add", "repo-remove", "bsdtar", "vercmp", "runuser", "gpg"]
