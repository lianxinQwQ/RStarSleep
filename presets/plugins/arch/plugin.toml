# Arch Linux build and maintenance plugin.
# Arch Linux 构建与维护插件。
schema_version = 1
api_version = 3
id = "arch"
version = "0.3.0"
system_types = ["arch"]
architectures = ["x86_64"]
cache_format = "arch-root-v1"
protected_packages = ["base"]

# Required host tools are checked before bootstrap.
# bootstrap 前检查的宿主必需工具。
[tools]
host = ["bash", "curl", "tar", "zstd", "gpgv", "cp", "rm", "mktemp", "cat", "dirname"]
# Required tools are checked inside the target system before system operations.
# 系统内操作前，在目标系统检查的必需工具。
system = ["bash", "pacman", "pacman-key", "awk", "cat", "rm", "mktemp", "dirname"]
