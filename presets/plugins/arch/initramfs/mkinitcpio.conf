# Preserve the target's configuration and enable the RStarSleep adapter only here.
source /etc/mkinitcpio.conf || return
for rstarsleep_config in /etc/mkinitcpio.conf.d/*.conf; do
    [[ -f "$rstarsleep_config" ]] || continue
    source "$rstarsleep_config" || return
done
source /usr/lib/rstarsleep/mkinitcpio-hooks.conf
