# Explicit trust bootstrap for additional repositories. No repository is trusted by default.
# 额外仓库的显式初始信任；默认不授权任何仓库。
# Enable the repository separately in pacman.conf.in. Values are unquoted INI text.
# 在 pacman.conf.in 中另外启用仓库；值为不加引号的 INI 文本。
#
# [your-repository]
# keyring_package = your-repository-keyring
# bootstrap_keys = FULL_PRIMARY_FINGERPRINT ANOTHER_FULL_PRIMARY_FINGERPRINT
# keyserver = hkps://keyserver.ubuntu.com
#
# Use full 40/64-digit primary fingerprints obtained through a trusted channel.
# 使用经可信渠道确认的完整主密钥指纹（40 或 64 位十六进制）。
# Multiple bootstrap keys are separated by spaces. keyserver is optional.
# 多个初始信任密钥用空格分隔；keyserver 可省略。
