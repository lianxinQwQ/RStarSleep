[package]
name = "RStarSleep"
version = "0.1.0"
edition = "2024"

[lib]
name = "rstarsleep"

[dependencies]
flate2 = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
serde_json = "1"
tar = "0.4"
tempfile = "3"
thiserror = "2"
toml = "0.9"
russh = { version = "0.61", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
unicode-width = "0.2"
rand = "0.10"
rsa = { version = "=0.10.0-rc.18", default-features = false }
xz2 = "0.1"
zstd = "0.13"

[build-dependencies]
flate2 = "1"
tar = "0.4"

[patch.crates-io]
rsa = { path = "vendor/rsa" }
russh = { path = "vendor/russh" }
